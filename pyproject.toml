[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-workbench"
version = "0.1.0"
description = "Local case and report application powered by volatility-mcp"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["volatility-mcp @ git+https://github.com/NoCoolUserName/volatility-mcp.git@5bede5123abf7286ddea0a05cf0482920d94ac2e"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1; sys_platform == 'darwin'"]

[project.scripts]
volatility-workbench = "volatility_workbench.cli:main"
volatility-workbench-desktop = "volatility_workbench.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_workbench = ["static/*.html", "static/*.js", "static/*.css", "static/*.png", "templates/*.md", "resources/*.json"]
