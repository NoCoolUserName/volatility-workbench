[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-workbench"
version = "0.1.0"
description = "Local case and report application powered by volatility-mcp"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["volatility-mcp @ git+https://github.com/NoCoolUserName/volatility-mcp.git@e9d9e12021c8ff51940beb810e0bbd95b69f4be6"]

[project.scripts]
volatility-workbench = "volatility_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_workbench = ["static/*.html", "static/*.js", "static/*.css", "static/*.png", "templates/*.md"]
