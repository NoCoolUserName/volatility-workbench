name: Workbench compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: node --check src/volatility_workbench/static/app.js
      - run: node --check src/volatility_workbench/static/settings.js
      - run: node --check src/volatility_workbench/static/themes.js
      - run: python scripts/package_smoke.py
