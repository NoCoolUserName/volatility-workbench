name: Workbench compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/update_readme_loc.py --check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: node --check src/volatility_workbench/static/app.js
      - run: node --check src/volatility_workbench/static/volshell.js
      - run: node --check src/volatility_workbench/static/adventure.js
      - run: node --check src/volatility_workbench/static/settings.js
      - run: node --check src/volatility_workbench/static/themes.js
      - run: python scripts/package_smoke.py

  browser:
    name: Synthetic browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/workbench-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/workbench-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run synthetic browser regressions with original packaged assets
        run: |
          export NODE_PATH="$RUNNER_TEMP/workbench-browser/node_modules"
          status=0
          for script in scripts/check_*_browser.cjs; do
            echo "Running $script"
            timeout 120s node "$script" || status=1
          done
          exit "$status"

  native-adventure:
    name: ARM64 Adventure build and gameplay
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build pinned game source and data
        run: python scripts/build_adventure.py --output "$RUNNER_TEMP" --python "$(command -v python)"
      - name: Check native architecture, gameplay, saves, and ad hoc signature
        run: |
          test "$(lipo -archs "$RUNNER_TEMP/adventure/advent-430")" = arm64
          printf 'no\nquit\nyes\n' | "$RUNNER_TEMP/adventure/advent-430" -o -a "$RUNNER_TEMP/adventure.save" - > "$RUNNER_TEMP/gameplay.txt"
          grep -qi road "$RUNNER_TEMP/gameplay.txt"
          test -s "$RUNNER_TEMP/adventure.save"
          codesign --force --sign - "$RUNNER_TEMP/adventure/advent-430"
          codesign --verify --strict "$RUNNER_TEMP/adventure/advent-430"
          test "$(lipo -archs "$RUNNER_TEMP/adventure/adventure-350")" = arm64
          export VOLATILITY_ADVENTURE_SAVE="$RUNNER_TEMP/classic.save"
          printf 'no\nsuspend\nyes\n' | "$RUNNER_TEMP/adventure/adventure-350" > "$RUNNER_TEMP/classic.txt"
          grep -qi road "$RUNNER_TEMP/classic.txt"
          test -s "$RUNNER_TEMP/classic.save"
          codesign --force --sign - "$RUNNER_TEMP/adventure/adventure-350"
          codesign --verify --strict "$RUNNER_TEMP/adventure/adventure-350"
          test -s "$RUNNER_TEMP/adventure/glorkz-350"
          test -s "$RUNNER_TEMP/adventure/COPYING-350"
          test -s "$RUNNER_TEMP/adventure/COPYING-430"
