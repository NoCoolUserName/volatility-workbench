name: Update core
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-core
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select eligible immutable release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/update_core.py
          if git diff --quiet; then
            echo "No eligible core update is available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha=$(python -c 'import json; print(json.load(open("core-dependency.json"))["commit"])')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
      - name: Validate candidate for manual adoption
        if: steps.candidate.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install .
          python -m unittest discover -s tests -q
          node --check src/volatility_workbench/static/app.js
          python scripts/package_smoke.py
      - name: Report validated candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          CORE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          echo '### A tested core update is available' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate commit: $CORE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Adopt it manually after review. This workflow has read-only permissions and does not push changes or open a pull request.' >> "$GITHUB_STEP_SUMMARY"
