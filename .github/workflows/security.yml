name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Security / SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned private-source scanner
        run: |
          python -m venv "$RUNNER_TEMP/security-venv"
          version=$(python -c 'import json; print(json.load(open(".github/security-rules.json"))["engine_version"])')
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install "semgrep==$version"
      - name: Test fail-closed security gate
        run: python -m unittest discover -s tests -p test_security_scan.py -v
      - name: Scan Python and JavaScript; block high or critical impact
        run: '"$RUNNER_TEMP/security-venv/bin/python" scripts/security_scan.py --work-dir "$RUNNER_TEMP/security-scan"'
      - name: Retain private security findings and coverage inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan
          path: |
            ${{ runner.temp }}/security-scan/findings.json
            ${{ runner.temp }}/security-scan/inventory.json
            ${{ runner.temp }}/security-scan/gate.json
            ${{ runner.temp }}/security-scan/semgrep.log
          if-no-files-found: error
          retention-days: 14
